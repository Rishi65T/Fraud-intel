name: Render Keep-Alive Trigger

on:
  schedule:
    # Trigger every 10 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Render Web Service URL (e.g. https://fraudintel.onrender.com)'
        required: false
        default: ''

jobs:
  ping-render:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          # Priority: Manual input -> GitHub Secret (RENDER_APP_URL) -> Default fallback
          TARGET_URL="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          fi
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://fraudintel.onrender.com"
          fi

          # Strip trailing slashes
          TARGET_URL="${TARGET_URL%/}"
          HEALTH_URL="${TARGET_URL}/api/health"

          echo "=========================================="
          echo "Keep-Alive Ping Trigger"
          echo "Target: $HEALTH_URL"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

          # Ping the health endpoint with a 45s timeout to allow for waking from cold start
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}" -m 45 "$HEALTH_URL" || true)

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          TIME_TOTAL=$(echo "$RESPONSE" | grep "TIME_TOTAL:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d' | sed '/TIME_TOTAL:/d')

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Time: ${TIME_TOTAL}s"
          echo "Response Body:"
          echo "$BODY"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render instance is awake and healthy!"
          else
            echo "WARNING: Received status code $HTTP_STATUS or timed out. Retrying in 10s..."
            sleep 10
            curl -f -s -m 45 "$HEALTH_URL" && echo "SUCCESS: Service woke up on retry!" || echo "Failed to reach endpoint."
          fi
